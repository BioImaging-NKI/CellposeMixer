# Build the extension jar and publish it as a GitHub release when a version tag is pushed.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The version is taken from the tag (v0.2.0 -> 0.2.0). Tags with a suffix (v0.2.0-rc1) become pre-releases.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "JAR=build/libs/qupath-extension-segmentation-$VERSION-all.jar" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION"

      - name: Build and test
        run: ./gradlew build shadowJar -PreleaseVersion="$VERSION" --no-daemon --console=plain

      - name: Check jar
        run: |
          test -f "$JAR"
          unzip -p "$JAR" nl/nki/qupath/ext/segmentation/build-info.properties
          unzip -p "$JAR" nl/nki/qupath/ext/segmentation/build-info.properties | grep -q "^version=$VERSION$"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
